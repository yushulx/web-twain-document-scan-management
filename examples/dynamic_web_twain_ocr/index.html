<!DOCTYPE html>
<html>

<head>
    <title>Dynamic Web TWAIN - OCR Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/dwt@19.5.0/dist/dynamsoft.webtwain.min.js"></script>
    <script>
        // Dynamic Web TWAIN 19.5.0 ships as a single file, so this sample loads the SDK
        // from the CDN instead of vendoring its ~140 MB desktop service installers.
        Dynamsoft.DWT.AutoLoad = true;
        Dynamsoft.DWT.ResourcesPath = "https://cdn.jsdelivr.net/npm/dwt@19.5.0/dist";
        // jsDelivr refuses files above 20 MB, so the service installers come from unpkg.
        Dynamsoft.DWT.ServiceInstallerLocation = "https://unpkg.com/dwt@19.5.0/dist/dist/";
        Dynamsoft.DWT.Containers = [{ WebTwainId: '', ContainerId: 'dwtcontrolContainer', Width: 350, Height: 380 }];
        Dynamsoft.DWT.ProductKey = 'DLS2eyJoYW5kc2hha2VDb2RlIjoiMjAwMDAxLTE2NDk4Mjk3OTI2MzUiLCJvcmdhbml6YXRpb25JRCI6IjIwMDAwMSIsInNlc3Npb25QYXNzd29yZCI6IndTcGR6Vm05WDJrcEQ5YUoifQ==';
        Dynamsoft.DWT.IfAddMD5InUploadHeader = false;
        Dynamsoft.DWT.IfConfineMaskWithinTheViewer = true;
    </script>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1>Dynamic Web TWAIN - OCR Demo</h1>
            </div>
        </header>

        <main class="app-main">
            <aside class="sidebar">
                <div class="control-group">
                    <div class="control-label">Input</div>
                    <div class="button-group">
                        <button onclick="AcquireImage();" class="btn btn-primary">Scan</button>
                        <button onclick="LoadImage();" class="btn btn-secondary">Load Image</button>
                    </div>
                </div>

                <div class="control-group">
                    <div class="control-label">Processing</div>
                    <div class="button-group">
                        <button onclick="correctOrientation();" class="btn btn-secondary">Correct Orientation</button>
                        <button onclick="recognize();" class="btn btn-primary">Recognize Text</button>
                    </div>
                    <select id="engine" class="form-select" onchange="fillLanguages(this.value)" title="OCR engine">
                        <option value="">Detecting OCR engines...</option>
                    </select>
                    <select id="language" class="form-select" title="Recognition language">
                    </select>
                    <p class="ocr-note">OCR Connector runs on Windows and macOS only. Linux is not supported yet.</p>
                    <select id="processingTarget" class="form-select">
                        <option value="current">Current Image</option>
                        <option value="all">All Images</option>
                    </select>
                </div>

                <div class="control-group">
                    <div class="control-label">Output</div>
                    <div class="button-group">
                        <button onclick="saveAsPDF();" class="btn btn-primary">Save as PDF</button>
                    </div>
                    <select id="outputFormat" class="form-select">
                        <option value="extralayer">With Extra Text Layer</option>
                        <option value="plaintext">Plain Text</option>
                    </select>
                </div>

                <div class="control-group">
                    <div class="control-label">Management</div>
                    <div class="button-group">
                        <button onclick="removeSelectedImage();" class="btn btn-primary">Remove Selected Image</button>
                        <button onclick="removeAllImages();" class="btn btn-primary">Remove All Images</button>
                    </div>
                </div>

                <div class="status-info" id="pageCounter">Page: 0 / 0</div>
            </aside>

            <div class="viewer-container">
                <div id="dwtcontrolContainer"></div>
                <div id="result"></div>
            </div>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
