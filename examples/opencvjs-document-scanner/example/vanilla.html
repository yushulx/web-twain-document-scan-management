<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCV.js Document Scanner — minimal example</title>
    <script>
      window.Module = {
        onRuntimeInitialized() {
          window.dispatchEvent(new Event('opencv-ready'));
        }
      };
    </script>
    <script async src="https://docs.opencv.org/4.8.0/opencv.js"></script>
    <script type="module">
      import { DocumentScanner } from '../src/document-scanner.ts';

      const status = document.getElementById('status');
      const input = document.getElementById('file');
      const photo = document.getElementById('photo');
      const output = document.getElementById('output');

      function ready() {
        return window.cv?.Mat
          ? Promise.resolve()
          : new Promise((resolve) => {
              window.addEventListener('opencv-ready', resolve, { once: true });
              const poll = setInterval(() => {
                if (window.cv?.Mat) { clearInterval(poll); resolve(); }
              }, 200);
            });
      }

      ready().then(() => {
        const scanner = new DocumentScanner();
        status.textContent = 'OpenCV.js is ready. Choose an image.';

        input.addEventListener('change', () => {
          const file = input.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => { photo.src = reader.result; };
          reader.readAsDataURL(file);
        });

        document.getElementById('run').addEventListener('click', () => {
          if (!photo.naturalWidth) {
            status.textContent = 'Choose an image first.';
            return;
          }
          try {
            // cv.imread() uses the element's displayed size, so work at the
            // image's natural resolution instead.
            const working = document.createElement('canvas');
            working.width = photo.naturalWidth;
            working.height = photo.naturalHeight;
            working.getContext('2d').drawImage(photo, 0, 0);
            const points = scanner.detect(working);
            const canvas = scanner.crop(working, points);
            output.src = canvas.toDataURL('image/png');
            status.textContent = `Detected ${points.length} corners → ${canvas.width} × ${canvas.height} px output.`;
          } catch (error) {
            status.textContent = `Detection failed: ${error.message}`;
          }
        });
      });
    </script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; color: #22303c; }
      h1 { font-size: 22px; }
      #status { color: #4b6274; margin: 12px 0; }
      .row { display: flex; gap: 24px; margin-top: 18px; }
      .row > div { flex: 1; min-width: 0; }
      img { max-width: 100%; border: 1px solid #d7e0e7; border-radius: 6px; }
      button { padding: 8px 14px; cursor: pointer; }
    </style>
  </head>
  <body>
    <h1>OpenCV.js Document Scanner</h1>
    <p id="status">Loading OpenCV.js…</p>
    <input type="file" id="file" accept="image/*" />
    <button id="run">Detect &amp; normalize</button>
    <div class="row">
      <div><h2>Input</h2><img id="photo" alt="Input document" /></div>
      <div><h2>Output</h2><img id="output" alt="Normalized document" /></div>
    </div>
  </body>
</html>
